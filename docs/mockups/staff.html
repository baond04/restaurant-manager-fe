<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bếp Cam – Nhân viên</title>
<meta name="description" content="Mockup giao diện nhân viên: menu theo quyền, sơ đồ bàn theo tầng, phục vụ, báo cáo, vai trò và quyền.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mockup tĩnh: dữ liệu giả trong JS, không gọi API. Icon: Lucide (ISC). */
:root{
  --bg:#ffffff; --surface:#fffaf5; --surface-2:#fff3e8; --line:#f1e4d8; --line-strong:#e6d3c2;
  --ink:#1c1917; --ink-2:#57534e; --muted:#78716c;
  --accent:#ea580c; --accent-strong:#c2410c; --accent-hover:#9a3412; --accent-soft:#ffedd5;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef9c3; --bad:#b91c1c; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(28,25,23,.06),0 4px 16px rgba(28,25,23,.06);
  --shadow-lg:0 8px 32px rgba(28,25,23,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:var(--accent-strong)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.1rem;font-weight:700} h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
small{font-size:.82rem}

/* Icon: một bộ, một màu (currentColor) */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.btn .i,.chip .i,.badge .i,.tab .i{width:16px;height:16px;vertical-align:-3px}
.badge .i{width:14px;height:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;cursor:pointer;transition:transform .15s,background .15s;white-space:nowrap;text-decoration:none;background:none}
.btn:hover:not(:disabled){transform:translateY(-1px)} .btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent-strong);color:#fff} .btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-ghost{background:#fff;border-color:var(--line-strong);color:var(--ink)} .btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-strong)}
.btn-sm{min-height:32px;padding:0 10px;font-size:.85rem}
.btn-lg{min-height:48px;font-size:1rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s;position:relative;color:var(--ink-2)}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-acc{background:var(--accent-soft);color:var(--accent-hover)} .b-info{background:var(--info-soft);color:var(--info)} .b-mut{background:#f5f5f4;color:var(--ink-2)}
.input,select.input{min-height:38px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 12px;background:#fff}
textarea.input{padding:8px 12px;min-height:70px}
.input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.chip{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;font-size:.88rem;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)} .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover);font-weight:600}
.sw{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--accent-strong)} .sw:checked::after{transform:translateX(18px)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:16px;overflow-x:auto;overflow-y:hidden}
.tab{padding:10px 16px;border:0;background:none;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{color:var(--accent-hover);border-color:var(--accent);font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:60px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;width:208px}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:.9rem}
.role-switch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px dashed var(--accent);border-radius:999px;padding:4px 6px 4px 14px;font-size:.85rem}
.role-switch select{border:0;background:#fff;border-radius:999px;min-height:30px;padding:0 10px;font-weight:600;cursor:pointer}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.cnt-dot{position:absolute;top:-4px;right:-4px;background:var(--accent-strong);color:#fff;border-radius:999px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-hover);display:grid;place-items:center;font-weight:700}
.side{background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side h4{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
.side h4:first-child{margin-top:4px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.side a:hover{background:var(--surface-2);color:var(--ink)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-hover);font-weight:600}
.side a .cnt{margin-left:auto}
.main{padding:24px 28px 56px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px}
.kpi .v{font-size:1.6rem;font-weight:800;line-height:1.2;margin-top:2px}
.kpi .d{font-size:.82rem;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.note{font-size:.84rem;color:var(--muted);margin:0 0 12px}

table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface)}
table.t tbody tr:hover{background:var(--surface)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover}
.tbl-wrap{overflow-x:auto}

/* Sơ đồ bàn */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.area-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.area-head:first-child{margin-top:0}
.area-head h2{margin:0}
.tile{border-radius:var(--r-lg);padding:12px 14px;border:2px solid;cursor:pointer;background:#fff;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{font-size:1.15rem}
.tile.wide{grid-column:span 2}
.tile.AVAILABLE{border-color:#bbf7d0;background:#f7fef9}
.tile.OCCUPIED{border-color:var(--accent);background:var(--accent-soft)}
.tile.RESERVED{border-color:#bfdbfe;background:#f5f9ff}
.tile.CLEANING{border-color:var(--line-strong);background:#fafaf9}
.tile .ping{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--bad);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(185,28,28,.55)}70%{box-shadow:0 0 0 10px rgba(185,28,28,0)}100%{box-shadow:0 0 0 0 rgba(185,28,28,0)}}
.seat{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:2px solid}
.lg-a::before{border-color:#86efac!important;background:#f7fef9} .lg-o::before{border-color:var(--accent)!important;background:var(--accent-soft)} .lg-r::before{border-color:#93c5fd!important;background:#f5f9ff} .lg-c::before{border-color:var(--line-strong)!important}
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters label.t{font-size:.82rem;color:var(--muted);font-weight:600;margin-right:2px}

/* Drawer */
.drawer{position:fixed;inset:0;background:rgba(28,25,23,.35);display:none;z-index:30;justify-content:flex-end}
.drawer.open{display:flex}
.drawer-in{width:min(440px,100%);background:#fff;height:100%;overflow:auto;padding:22px;box-shadow:var(--shadow-lg)}
.qr{width:170px;height:170px;margin:12px auto;display:grid;grid-template-columns:repeat(21,1fr);border:8px solid #fff;outline:1px solid var(--line)}
.qr i{aspect-ratio:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pos-item{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.pos-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pos-item .ph{aspect-ratio:4/3;overflow:hidden} .pos-item img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pos-item:hover img{transform:scale(1.03)}
.pos-item div.tx{padding:8px 10px} .pos-item b{display:block;font-size:.9rem}
.price{color:var(--accent-hover);font-weight:700}
.ticket{position:sticky;top:84px}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line-note{width:100%;margin-top:6px;min-height:32px;font-size:.85rem}
.sum{display:flex;justify-content:space-between;padding:6px 0;gap:12px}
.sum.total{font-size:1.2rem;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}

/* KDS & Phục vụ */
.kds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kcol{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-height:50vh}
.kcol h2{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;border-bottom:3px solid}
.kcol.c0 h2{border-color:var(--warn)} .kcol.c1 h2{border-color:var(--accent)} .kcol.c2 h2{border-color:var(--ok)}
.kcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px;background:#fff;transition:transform .15s,box-shadow .15s}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard.late{border-color:var(--bad);background:#fffafa}
.kcard .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kcard .tb{font-size:1.25rem;font-weight:800}
.kcard ul{margin:8px 0;padding-left:18px} .kcard li{margin:2px 0}
.kcard .nt{font-size:.85rem;color:var(--bad);font-weight:600}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* Chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .bar{fill:var(--accent);transition:opacity .15s}
.chart .hit{fill:transparent;cursor:pointer}
.chart g:hover .bar{opacity:.8}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:#fff;stroke-width:2}
#gtip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:.82rem;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:50}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hb:last-child{border:0}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.low i{background:var(--bad)}
.top-list{list-style:none;margin:0;padding:0}
.top-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}

/* Lịch */
.sched{display:grid;grid-template-columns:120px repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.sched > div{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:64px;font-size:.85rem}
.sched .hd{background:var(--surface);font-weight:600;min-height:auto;text-align:center}
.sched .hd.today{background:var(--accent-soft);color:var(--accent-hover)}
.sched .sh{background:var(--surface);font-weight:600}
.pill{display:block;background:var(--accent-soft);color:var(--accent-hover);border-radius:6px;padding:2px 6px;margin:2px 0;font-size:.78rem;font-weight:500}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fff}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day.off{background:#fafaf9;color:var(--muted)}

/* Vai trò & quyền */
.roles{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.role-list{padding:8px}
.role-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;transition:background .15s}
.role-item:hover{background:var(--surface-2)}
.role-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent-hover)}
.role-item small{display:block;color:var(--muted)}
.role-body{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.pgroup{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:#fff;overflow:hidden}
.pgroup-h{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);cursor:default}
.pgroup-h .ttl{display:flex;gap:8px;align-items:center;font-weight:600;flex:1}
.pgroup-h input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent-strong);cursor:pointer}
.pgroup-h .tg{background:none;border:0;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;width:28px;height:28px;border-radius:6px}
.pgroup-h .tg:hover{background:var(--surface-2)}
.pgroup.closed .prow{display:none} .pgroup.closed .tg .i{transform:rotate(-90deg)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.prow .tx{flex:1;min-width:0} .prow code{font-size:.8rem;color:var(--ink-2);background:var(--surface-2);padding:1px 6px;border-radius:5px}
.prow.chg{background:var(--warn-soft)}
.savebar{position:sticky;bottom:12px;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 14px;margin-top:12px;box-shadow:var(--shadow-lg)}
.savebar span{flex:1}
.savebar .btn-ghost{background:transparent;color:#fff;border-color:#57534e}
.preview{position:sticky;top:84px}
.pv{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink-2)}
.pv.new{color:var(--ok);font-weight:600}
.notice{background:var(--info-soft);color:#1e3a8a;border-radius:var(--r);padding:12px 14px;font-size:.9rem;margin-bottom:16px}
.notice.acc{background:var(--accent-soft);color:var(--accent-hover)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.convo{padding:10px 0;border-bottom:1px solid var(--line)}
.convo q{display:block;font-style:normal}
.treebtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2)}
.treebtn:hover{background:var(--surface-2)} .treebtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-hover);font-weight:600}
.treebtn.fl{font-weight:700;color:var(--ink);margin-top:8px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form-row .fld{display:flex;flex-direction:column;gap:4px} .form-row label{font-size:.82rem;font-weight:600}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.notif{position:absolute;top:50px;right:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:8px;display:none;z-index:20}
.notif.open{display:block}
.notif a{display:block;padding:10px;border-radius:var(--r-sm);font-size:.9rem;color:var(--ink);text-decoration:none} .notif a:hover{background:var(--surface)}
.burger{display:none}

@media (max-width:1180px){.kpis{grid-template-columns:1fr 1fr}.grid-2,.grid-eq,.pos,.role-body{grid-template-columns:1fr}.ticket,.preview{position:static}.grid-3{grid-template-columns:1fr}}
@media (max-width:900px){.roles{grid-template-columns:1fr}.kds{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:60px;width:270px;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .burger{display:grid}
  .logo{width:auto}
  .me span:not(.avatar){display:none}
  .role-switch>span{display:none}
  .main{padding:16px}
  .sched{grid-template-columns:90px repeat(7,minmax(90px,1fr));overflow-x:auto}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.role-switch{padding:4px}.notif{width:calc(100vw - 32px);right:-60px}.top-right .btn{display:none}}

</style>

function barSVG(data,{max,hl=-1,H=230,fmtV=v=>v.toLocaleString('vi-VN')}={}){
  const W=640,pl=40,pb=26,bw=Math.min(40,(W-pl)/data.length*.55),step=(W-pl)/data.length,top=14;
  max=max||Math.ceil(Math.max(...data.map(d=>d[1]))*1.1/5)*5;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột">`;
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  ticks.forEach(v=>{const y=H-pb-(v/max)*(H-pb-top);s+=`<line class="gridl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${v}</text>`});
  data.forEach(([l,v],i)=>{const h=(v/max)*(H-pb-top),x=pl+i*step+(step-bw)/2,y=H-pb-h;
    s+=`<g data-tip="${l}: ${fmtV(v)}"><rect class="hit" x="${pl+i*step}" y="0" width="${step}" height="${H-pb}"/><path class="bar" d="M${x},${H-pb}V${y+4}a4,4 0 0 1 4,-4h${bw-8}a4,4 0 0 1 4,4V${H-pb}Z"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${l}</text>${i===hl?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtV(v)}</text>`:''}</g>`});
  return s+'</svg>';
}
function lineSVG(data,{H=230,fmtV=v=>v}={}){
  const W=640,pl=40,pb=26,top=14,max=Math.ceil(Math.max(...data.map(d=>d[1]))*1.1/2)*2,step=(W-pl)/(data.length-1||1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ đường">`;
  [0,.5,1].forEach(f=>{const v=Math.round(max*f),y=H-pb-f*(H-pb-top);s+=`<line class="gridl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${v}</text>`});
  const pts=data.map(([l,v],i)=>[pl+i*step,H-pb-(v/max)*(H-pb-top),l,v]);
  s+=`<polyline class="ln" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<g data-tip="${p[2]}: ${fmtV(p[3])}"><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>${i%2===0?`<text x="${p[0]}" y="${H-8}" text-anchor="middle">${p[2]}</text>`:''}</g>`});
  return s+'</svg>';
}
function hbars(rows,{max,fmtV=v=>v.toLocaleString('vi-VN'),low=false}={}){
  max=max||Math.max(...rows.map(r=>r[1]));
  return rows.map(([l,v])=>`<div class="hb"><span>${l}</span><div class="meter ${low?'low':''}"><i style="width:${v/max*100}%"></i></div><b>${fmtV(v)}</b></div>`).join('');
}

  const f=FLOORS.find(x=>x.id===fl.floor);let h='';

function billCalc(voucher){
  const lines=[[9,4],[1,6],[6,4],[10,6],[13,10],[11,6]],sub=lines.reduce((s,[i,q])=>s+q*byId(i).price,0),a=areaById('a4');
  const topup=Math.max(0,a.min-sub),base=sub+topup,fee=base*a.fee/100,disc=voucher?Math.min(base*.1,50000):0,pts=10000,vat=(base+fee-disc-pts)*.08;
  return {lines,sub,topup,fee,disc,pts,vat,total:base+fee-disc-pts+vat,a};
}

      <div class="form-row"><div class="fld"><label for="bp">Tiền tố</label><input class="input" id="bp" style="width:80px" value="${a.id==='a3'?'T':a.id==='a2'?'B':'A'}"></div>
       <div class="fld"><label for="bc">Số lượng</label><input class="input" id="bc" type="number" min="1" max="20" value="4" style="width:90px"></div>
       <div class="fld"><label for="bs">Số chỗ mỗi bàn</label><input class="input" id="bs" type="number" min="1" max="30" value="4" style="width:110px"></div>
       <button class="btn btn-primary" id="bulk">${ic('plus')}Thêm bàn</button></div>
      <p class="note" style="margin:8px 0 0">Mã bàn tự đánh số tiếp theo (ví dụ A11, A12…). Mỗi bàn có mã QR riêng.</p></div>
     <div class="panel tbl-wrap" style="margin-top:16px"><table class="t"><thead><tr><th>Bàn</th><th>Số chỗ</th><th>Trạng thái</th><th>Mã QR</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td><b>${t.code}</b></td><td>${t.seats} chỗ</td><td><span class="badge ${ST_BADGE[t.st]}">${ST_LABEL[t.st]}</span></td><td><button class="btn btn-ghost btn-sm" data-toast="Đã tạo mã QR mới. Mã cũ hết hiệu lực.">${ic('qr-code')}Đổi mã</button></td><td style="text-align:right"><button class="btn btn-ghost btn-sm" data-toast="${t.st==='OCCUPIED'?'Bàn đang có khách, chỉ ngừng dùng được sau khi thanh toán.':'Đã ngừng dùng bàn. Bàn đã có đơn không bị xóa.'}">${ic('ban')}Ngừng dùng</button></td></tr>`).join('')}</tbody></table></div>`;
  };
  tree();body();
  $('#flTree').onclick=e=>{
    const a=e.target.closest('[data-a]'),f=e.target.closest('[data-f]'),n=e.target.closest('[data-addarea]');
    if(a){sel.a=a.dataset.a;sel.f=floorOfArea(sel.a).id}
    else if(f){sel.f=+f.dataset.f;sel.a=null}
    else if(n){const fo=FLOORS.find(x=>x.id===+n.dataset.addarea),id='a'+(Date.now()%100000);fo.areas.push({id,name:'Khu vực mới '+(fo.areas.length+1),type:'HALL',fee:0,min:0});sel={f:fo.id,a:id};toast('Đã thêm khu vực. Bấm "Thêm bàn" để tạo bàn cho khu vực này.')}
    tree();body();
  };
  $('#flBody').onclick=e=>{
    if(!e.target.closest('#bulk'))return;
    const p=$('#bp').value.trim()||'X',c=Math.min(20,Math.max(1,+$('#bc').value)),s=Math.max(1,+$('#bs').value);
    let n=Math.max(0,...TABLES.filter(t=>t.code.startsWith(p)).map(t=>parseInt(t.code.slice(p.length))||0));
    for(let i=0;i<c;i++)TABLES.push(T(p+String(++n).padStart(2,'0'),sel.a,s,'AVAILABLE'));
    body();toast(`Đã thêm ${c} bàn ${s} chỗ. Bàn mới hiện ngay ở Sơ đồ bàn.`);
  };
  $('#addFloor').onclick=()=>{const id=FLOORS.length+1;FLOORS.push({id,name:'Tầng '+id,areas:[]});tree();toast('Đã thêm tầng '+id+'. Thêm khu vực để bắt đầu.')};
},
ai(){
  const b=$('#retrain');if(b.disabled)return;
  b.onclick=()=>{const p=$('#prog'),i=p.firstElementChild;p.hidden=false;let v=0;b.disabled=true;
    const steps=['Đọc tương tác từ MySQL','Dựng đồ thị khách – món – thuộc tính','Huấn luyện GNN+GCL (GPU)','Đánh giá trên tập validation'];
    const h=setInterval(()=>{v+=5;i.style.width=v+'%';$('#progTxt').textContent=steps[Math.min(3,Math.floor(v/25))]+'…';if(v>=100){clearInterval(h);$('#progTxt').textContent='Xong: Recall@20 = 0,0641 ≥ 0,0630 → đã dùng bản v4';b.disabled=false;toast('Đã dùng mô hình v4')}},150)};
},
users(){
  const U=[['Lê Quân','quan@bepcam.example','MANAGER',1],['Phạm Thảo','thao@bepcam.example','WAITER',1],['Đỗ Linh','linh@bepcam.example','CASHIER',1],['Vũ Hùng','hung@bepcam.example','CHEF',1],['Mai Lan','lan@bepcam.example','WAITER',0],['Quốc Bảo','bao@bepcam.example','WAITER',1]];
  const draw=()=>{const q=$('#usQ').value.toLowerCase();
    $('#usTable').innerHTML=`<table class="t"><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>${U.map((u,i)=>[u,i]).filter(([u])=>(u[0]+u[1]).toLowerCase().includes(q)).map(([u,i])=>`<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td><select class="input" data-role="${i}" aria-label="Vai trò của ${u[0]}">${ROLES.filter(r=>!r.fixed).map(r=>`<option value="${r.code}" ${r.code===u[2]?'selected':''}>${r.name}</option>`).join('')}</select></td><td>${u[3]?'<span class="badge b-ok">Hoạt động</span>':'<span class="badge b-bad">Đã khóa</span>'}</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" data-lock="${i}">${ic(u[3]?'lock':'lock-open')}${u[3]?'Khóa':'Mở khóa'}</button></td></tr>`).join('')}</tbody></table>`};
  draw();$('#usQ').oninput=draw;
  $('#usTable').onchange=e=>{if(e.target.dataset.role!==undefined){U[+e.target.dataset.role][2]=e.target.value;toast('Đã đổi vai trò. Token cũ của người này bị từ chối ở request kế tiếp.')}};
  $('#usTable').onclick=e=>{const b=e.target.closest('[data-lock]');if(b){const u=U[+b.dataset.lock];u[3]=u[3]?0:1;toast(u[3]?'Đã mở khóa':'Đã khóa tài khoản và thu hồi mọi phiên đăng nhập');draw()}};
},
roles(){
  let sel='WAITER',draft=new Set(ROLES.find(r=>r.code===sel).perms),q='',closed=new Set();
  const saved=()=>ROLES.find(r=>r.code===sel);
  const diff=()=>{const s=saved().perms;return [...draft].filter(p=>!s.has(p)).length+[...s].filter(p=>!draft.has(p)).length};
  const lst=()=>{$('#roleList').innerHTML=ROLES.map(r=>`<button class="role-item" data-r="${r.code}" aria-current="${r.code===sel}">${ic(r.locked?'lock':r.fixed?'user':'shield-check')}<span><b>${r.name}</b><small>${r.code} · ${r.users} người</small></span></button>`).join('')};
  const vis=(perms)=>NAV.filter(n=>visible(n,perms));
  const main=()=>{
    const r=saved(),ro=r.locked||r.fixed;
    if(r.fixed){$('#roleMain').innerHTML=`<div class="panel"><h2>${r.name}</h2><p class="muted">${r.desc}</p><div class="notice">Quyền của khách (trò chuyện với trợ lý, đặt bàn của mình, viết đánh giá) cố định trong code, không có công tắc nào để sửa.</div></div>`;return}
    const groups=GROUPS.map(g=>{
      const ps=g.p.filter(([c,d])=>!q||(c+' '+d+' '+g.g).toLowerCase().includes(q));if(!ps.length)return '';
      const on=g.p.filter(([c])=>draft.has(c)).length,all=on===g.p.length;
      return `<div class="pgroup ${closed.has(g.g)?'closed':''}" data-g="${g.g}"><div class="pgroup-h"><input type="checkbox" data-gall="${g.g}" ${all?'checked':''} ${on&&!all?'data-ind="1"':''} ${ro?'disabled':''} aria-label="Chọn cả nhóm ${g.g}"><span class="ttl">${ic(g.ic)}${g.g}</span><span class="badge ${on?'b-acc':'b-mut'}">${on}/${g.p.length}</span><button class="tg" data-tg="${g.g}" aria-label="Thu gọn nhóm ${g.g}">${ic('chevron-down')}</button></div>
       ${ps.map(([c,d])=>`<label class="prow ${draft.has(c)!==r.perms.has(c)?'chg':''}"><span class="tx"><b style="font-weight:500">${d}</b><br><code>${c}</code></span><input type="checkbox" class="sw" data-p="${c}" ${draft.has(c)?'checked':''} ${ro?'disabled':''}></label>`).join('')}</div>`}).join('')||'<div class="panel empty">Không có quyền khớp từ khóa.</div>';
    const now=new Set(vis(draft).map(n=>n.id)),was=new Set(vis(r.perms).map(n=>n.id)),rmv=[...was].filter(i=>!now.has(i));
    const d=diff();
    $('#roleMain').innerHTML=`<div class="panel" style="margin-bottom:16px"><div class="form-row" style="align-items:center;justify-content:space-between"><div style="flex:1;min-width:220px">
      ${r.system?`<h2 style="margin:0">${r.name} <span class="badge b-mut">Vai trò hệ thống</span></h2><p class="muted" style="margin:4px 0 0">${r.desc}</p>`:`<div class="fld"><label for="rn">Tên vai trò</label><input class="input" id="rn" value="${r.name}"></div><div class="fld" style="margin-top:8px"><label for="rd">Mô tả</label><input class="input" id="rd" value="${r.desc}"></div>`}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${r.system?'':`<button class="btn btn-ghost" id="delRole">${ic('trash-2')}Xóa vai trò</button>`}</div></div>
      ${r.locked?`<div class="notice acc" style="margin:14px 0 0">${ic('lock')} Quản trị luôn có đủ ${ALL.length} quyền và không sửa được. Nhờ vậy luôn còn một tài khoản vào được màn hình này.</div>`:''}</div>
     <div class="role-body"><div>
       <div class="filters"><input class="input" id="pq" style="flex:1;min-width:200px" placeholder="Tìm quyền: thanh toán, bếp, báo cáo…" value="${q}" aria-label="Tìm quyền">
        ${ro?'':`<button class="btn btn-ghost btn-sm" id="allOn">Bật tất cả</button><button class="btn btn-ghost btn-sm" id="allOff">Tắt tất cả</button>`}</div>
       ${groups}
       ${d?`<div class="savebar"><span>${ic('info')} Đã sửa ${d} quyền, chưa lưu</span><button class="btn btn-ghost btn-sm" id="cancel">Hủy</button><button class="btn btn-primary btn-sm" id="save">Lưu thay đổi</button></div>`:''}
     </div>
     <aside class="panel preview"><h2>Menu người này sẽ thấy</h2><p class="note">Tính từ các quyền đang bật. Trang mới hiện màu xanh.</p>
       ${vis(draft).map(n=>`<div class="pv ${was.has(n.id)?'':'new'}">${ic(n.ic)}${n.t}${was.has(n.id)?'':' <span class="badge b-ok">mới</span>'}</div>`).join('')||'<p class="muted">Chưa có trang nào.</p>'}
       ${rmv.length?`<p class="note" style="margin-top:10px">Sẽ ẩn: ${rmv.map(i=>NAV.find(n=>n.id===i).t).join(', ')}</p>`:''}
       <p class="note" style="margin-top:12px">Lớp chặn thật là backend: mọi API kiểm tra quyền. Menu chỉ ẩn hoặc hiện cho gọn.</p></aside></div>`;
    $$('#roleMain input[data-ind]').forEach(i=>i.indeterminate=true);
  };
  const refresh=()=>{lst();main()};
  refresh();
  $('#roleList').onclick=e=>{const b=e.target.closest('[data-r]');if(b){sel=b.dataset.r;draft=new Set(saved().perms);q='';refresh()}};
  $('#cloneRole').onclick=()=>{const src=saved().fixed?ROLES.find(r=>r.code==='WAITER'):saved(),n=ROLES.length;const nr={code:'CUSTOM_'+n,name:'Bản sao của '+src.name,desc:'Vai trò tùy chỉnh.',users:0,system:false,perms:new Set(src.perms)};ROLES.push(nr);sel=nr.code;draft=new Set(nr.perms);renderRoleSelect();refresh();toast('Đã nhân bản. Đặt tên rồi bật hoặc tắt quyền theo ý bạn.')};
  const m=$('#roleMain');
  m.addEventListener('click',e=>{
    const t=e.target;
    if(t.closest('[data-tg]')){const g=t.closest('[data-tg]').dataset.tg;closed.has(g)?closed.delete(g):closed.add(g);main()}
    if(t.closest('#allOn')){draft=new Set(ALL);main()} if(t.closest('#allOff')){draft=new Set();main()}
    if(t.closest('#cancel')){draft=new Set(saved().perms);main()}
    if(t.closest('#save')){const r=saved();r.perms=new Set(draft);renderNav();renderRoleSelect();main();toast(`Đã lưu. ${r.users} người dùng vai trò ${r.name} nhận quyền mới ở request kế tiếp, không cần đăng xuất.`)}
    if(t.closest('#delRole')){const i=ROLES.indexOf(saved());ROLES.splice(i,1);sel='WAITER';draft=new Set(saved().perms);renderRoleSelect();refresh();toast('Đã xóa vai trò')}
  });
  m.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.p){t.checked?draft.add(t.dataset.p):draft.delete(t.dataset.p);main()}
    if(t.dataset.gall){const g=GROUPS.find(x=>x.g===t.dataset.gall);g.p.forEach(([c])=>t.checked?draft.add(c):draft.delete(c));main()}
  });
  m.addEventListener('input',e=>{
    if(e.target.id==='pq'){q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;main();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos)}
    if(e.target.id==='rn'){saved().name=e.target.value;lst();renderRoleSelect()} if(e.target.id==='rd')saved().desc=e.target.value;
  });
}};

/* ================= Ngăn kéo bàn ================= */
function openTable(t){
  const a=areaById(t.area),f=floorOfArea(t.area);
  const qr=Array.from({length:441},(_,k)=>{const x=k%21,y=Math.floor(k/21),fnd=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=fnd?(x%6===0||y%6===0||(x%20>=2&&x%20<=4&&y%20>=2&&y%20<=4)||(x>=16&&x<=18&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=16&&y<=18)||x===20||y===20||x===14||y===14):((x*7+y*13+x*y)%3===0);return `<i style="background:${on?'#1c1917':'#fff'}"></i>`}).join('');
  const busy=t.st==='OCCUPIED',rq=openReq(t.code);
  const act=[];
  if(busy){
    if(can('order:create'))act.push(`<a class="btn btn-primary" href="#pos">${ic('clipboard-list')}Gọi thêm món</a>`);
    act.push(can('bill:pay')?`<a class="btn btn-primary" href="#billing">${ic('credit-card')}Thanh toán</a>`:`<button class="btn btn-ghost" data-toast="Đã báo thu ngân">${ic('bell')}Báo thu ngân</button>`);
    if(can('table:operate'))act.push(`<button class="btn btn-ghost" data-toast="Đã chuyển sang bàn trống cùng số chỗ">${ic('arrow-right')}Chuyển bàn</button>`);
  }else if(t.st==='AVAILABLE'&&can('table:operate'))act.push(`<button class="btn btn-primary" data-open="${t.code}">${ic('door-open')}Mở bàn</button>`);
  else if(t.st==='RESERVED'&&can('reservation:manage'))act.push(`<button class="btn btn-primary" data-open="${t.code}">${ic('check')}Check-in và mở bàn</button>`);
  else if(t.st==='CLEANING'&&can('table:operate'))act.push(`<button class="btn btn-primary" data-clean="${t.code}">${ic('check')}Dọn xong, đặt về Trống</button>`);
  if(can('request:handle')&&rq.length)act.push(`<a class="btn btn-ghost" href="#service">${ic('concierge-bell')}Xử lý yêu cầu</a>`);
  $('#drawerIn').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:1.4rem">Bàn ${t.code}</h2><button class="icon-btn" id="dClose" aria-label="Đóng">${ic('x')}</button></div>
   <p class="muted">${f.name} · ${a.name} · ${t.seats} chỗ · <span class="badge ${ST_BADGE[t.st]}">${ST_LABEL[t.st]}</span></p>
   ${a.type==='VIP_ROOM'?`<div class="notice acc">${ic('crown')} Phòng VIP: chi tối thiểu ${fmt(a.min)}, phụ thu ${a.fee}%.</div>`:''}
   ${rq.map(r=>`<div class="notice acc">${ic(RQ_ICON[r.type])} Khách yêu cầu: <b>${RQ_LABEL[r.type]}</b> (${mins(r.at)} phút trước)</div>`).join('')}
   ${busy?`<h3>Đơn đang mở</h3>${[[2,'Bún chả Hà Nội','Đang nấu','b-acc'],[1,'Bò lúc lắc','Chờ bếp','b-warn'],[2,'Sâm dứa sữa','Đã phục vụ','b-ok']].map(l=>`<div class="line"><span>${l[0]} × ${l[1]}</span><span class="badge ${l[3]}">${l[2]}</span></div>`).join('')}`:`<p>${t.st==='AVAILABLE'?'Bàn đang trống. Mở bàn để khách quét QR và tự gọi món.':t.info}</p>`}
   <h3 style="margin-top:16px">Mã QR của bàn</h3><div class="qr" role="img" aria-label="Mã QR minh họa">${qr}</div><p class="muted" style="text-align:center;font-size:.82rem">QR chỉ dùng để gọi món khi bàn đang mở.</p>
   <div class="actions">${act.join('')||'<p class="muted" style="grid-column:1/-1">Vai trò này chỉ có quyền xem bàn.</p>'}</div>`;
  $('#drawer').classList.add('open');$('#dClose').onclick=closeDrawer;$('#dClose').focus();
}
function closeDrawer(){$('#drawer').classList.remove('open')}
$('#drawer').onclick=e=>{
  const o=e.target.closest('[data-open]'),c=e.target.closest('[data-clean]');
  if(o){const t=tableByCode(o.dataset.open);t.st='OCCUPIED';t.info='Vừa mở · 0 khách';closeDrawer();toast(`Đã mở bàn ${t.code}. QR bắt đầu nhận gọi món.`);if(view==='tables')drawFloor()}
  else if(c){const t=tableByCode(c.dataset.clean);t.st='AVAILABLE';t.info='';closeDrawer();toast(`Bàn ${t.code} đã sẵn sàng`);if(view==='tables')drawFloor()}
  else if(e.target.id==='drawer'||e.target.closest('a'))closeDrawer();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('#notif').classList.remove('open')}});
$('#bellBtn').onclick=()=>{const o=$('#notif').classList.toggle('open');$('#bellBtn').setAttribute('aria-expanded',o)};
$('#burger').onclick=()=>{const o=$('#side').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
renderRoleSelect();route();
</script>
</body>
</html>
